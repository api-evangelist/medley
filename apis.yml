aid: medley
name: Medley
description: >-
  Medley is a leadership development company that delivers group-based executive
  coaching at enterprise scale, pairing professional coaches with AI-enabled
  tooling to bring quality and a human touch to Fortune 500 organizations.
  Founded in 2020 by Edith Cooper and Jordan Taylor, the platform runs curated
  small-group coaching cohorts focused on trust, empathy, communication, and
  collaboration to drive organizational transformation. Medley raised a $3.7M
  seed round led by Andreessen Horowitz (a16z). It operates as a B2B services
  and coaching platform and does not currently publish a public developer API.
